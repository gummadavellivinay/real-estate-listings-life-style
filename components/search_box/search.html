<section class="search-panel" aria-label="Find your home">
  <form class="search-form">
    <label class="sr-only" for="home-query">Describe your ideal home</label>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
    <input id="home-query" type="search" placeholder="Describe your home, your budget, your everyday…" autocomplete="off" />
    <button class="mic" type="button" aria-label="Start voice search" aria-pressed="false" title="Speak your search">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
      <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button>
    <button class="submit" type="submit">Find my home <span aria-hidden="true">↗</span></button>
  </form>
  <p class="status" role="status" aria-live="polite">Type your wish list, or tap the microphone to speak.</p>
  <div class="suggestion-label">A LITTLE INSPIRATION</div>
  <div class="suggestions" aria-label="Suggested searches"></div>
</section>
